name: Build Sarvatobhadra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create sarvatobhadra com.example.sarvatobhadra Sarvatobhadra
        cd sarvatobhadra
        cordova platform add android

    - name: Copy Web Files to www
      run: |
        # सभी कोड फाइलें कॉपी करें
        cp index.html style.css sbc-logic.js app.js sarvatobhadra/www/ 2>/dev/null || true
        # .se1 फाइलें कॉपी करें (ताकि ऐप ऑफलाइन काम करे)
        cp *.se1 sarvatobhadra/www/ 2>/dev/null || true

    - name: Build APK
      run: |
        cd sarvatobhadra
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sarvatobhadra-APK
        path: sarvatobhadra/**/*.apk
