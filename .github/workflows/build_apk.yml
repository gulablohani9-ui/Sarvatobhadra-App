name: Build Sarvatobhadra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create sarvatobhadra com.example.sarvatobhadra Sarvatobhadra
        cd sarvatobhadra
        cordova platform add android

    - name: Copy Web Files to www
      run: |
        cp index.html style.css sbc-logic.js app.js sarvatobhadra/www/ || true
        cp *.se1 sarvatobhadra/www/ || true
        echo "--- www फोल्डर की फाइलें देखें ---"
        ls -la sarvatobhadra/www/

    - name: Build APK
      run: |
        cd sarvatobhadra
        # यहाँ -- --packageType=apk लगाया गया है ताकि AAB की जगह APK बने
        cordova build android --release -- --packageType=apk
        echo "--- APK फाइल कहाँ बनी है, यह देखें ---"
        find . -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sarvatobhadra-APK
        path: sarvatobhadra/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error
